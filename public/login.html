<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEXO | Ingresar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .logo-wrap img {
      height: 64px;
      object-fit: contain;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: #f1f5f9;
      margin-bottom: 0.25rem;
    }
    .sub {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #334155; cursor: not-allowed; }
    .error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .footer-text {
      text-align: center;
      color: #475569;
      font-size: 0.75rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo.png" alt="Texo Sistemas" onerror="this.style.display='none'">
    </div>
    <h1>Visualizador de Facturas</h1>
    <p class="sub">Texo Sistemas — Ingresá con tu cuenta</p>

    <div class="error" id="error"></div>

    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="usuario@texo.com.py" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button class="btn" id="btn" type="submit">Ingresar</button>
    </form>

    <p class="footer-text">Desarrollado por Danilo Sosa | Texo Sistemas</p>
  </div>

  <script>
    // Si ya está logueado, redirigir al inicio
    if (localStorage.getItem('texo_token')) {
      window.location.href = '/';
    }

    async function login(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();

        if (!r.ok) {
          errorEl.textContent = data.error || 'Error al iniciar sesión';
          errorEl.style.display = 'block';
          return;
        }

        localStorage.setItem('texo_token', data.token);
        localStorage.setItem('texo_nombre', data.nombre);
        localStorage.setItem('texo_rol', data.rol);
        window.location.href = '/';
      } catch {
        errorEl.textContent = 'Error de conexión. Intentá de nuevo.';
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    }
  </script>
</body>
</html>
