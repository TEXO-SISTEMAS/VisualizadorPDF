<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Texo Sistemas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; }
    header span { font-size: 13px; color: #718096; }
    .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-edit { background: #374151; color: #e2e8f0; }
    .btn-edit:hover { background: #4b5563; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
    th { background: #1a1f2e; padding: 10px 12px; text-align: left; color: #a0aec0; font-weight: 600; border-bottom: 1px solid #2d3748; }
    td { padding: 10px 12px; border-bottom: 1px solid #1e2330; vertical-align: middle; }
    tr:hover td { background: #1a1f2e; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-admin { background: #7c3aed; color: white; }
    .badge-usuario { background: #374151; color: #a0aec0; }
    .badge-activo { background: #065f46; color: #6ee7b7; }
    .badge-inactivo { background: #7f1d1d; color: #fca5a5; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 10px; padding: 24px; width: 440px; max-width: 95vw; }
    .modal h2 { font-size: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px 12px; background: #0f1117; border: 1px solid #2d3748; border-radius: 6px; color: #e2e8f0; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .alert-error { background: #7f1d1d; color: #fca5a5; }
    .alert-success { background: #065f46; color: #6ee7b7; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .empresa-cell { color: #f6ad55; }
    .email-cell { color: #63b3ed; font-size: 12px; }
    .pass-cell { font-family: monospace; color: #68d391; font-size: 12px; }
    .actions-cell { display: flex; gap: 6px; }
  </style>
</head>
<body>

<header>
  <h1>Gestión de Usuarios</h1>
  <span>Texo Sistemas — Panel Administrador</span>
</header>

<div class="container">
  <div id="alert" style="display:none"></div>

  <div class="top-bar">
    <p style="color:#718096;font-size:13px;">Usuarios del sistema con acceso al Visualizador de Facturas</p>
    <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo Usuario</button>
  </div>

  <table id="tabla">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Contraseña</th>
        <th>Empresa asignada</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modal-title">Nuevo Usuario</h2>
    <input type="hidden" id="edit-id">

    <div class="form-row">
      <div class="form-group">
        <label>Nombre completo *</label>
        <input type="text" id="f-nombre" placeholder="Juan Pérez">
      </div>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="f-email" placeholder="usuario@texo.com.py">
    </div>
    <div class="form-group">
      <label>Contraseña *</label>
      <input type="text" id="f-password" placeholder="Contraseña visible">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Empresa asignada</label>
        <select id="f-empresa">
          <option value="">— Todas (Admin) —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="f-rol">
          <option value="usuario">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="activo-row" style="display:none">
      <label>Estado</label>
      <select id="f-activo">
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-edit" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const KEY = new URLSearchParams(location.search).get('key') || '';
  if (!KEY) { document.body.innerHTML = '<p style="padding:40px;color:#ef4444">Acceso denegado. Usá ?key=texo2024</p>'; }

  let empresas = [];
  let editando = false;

  async function cargar() {
    const r = await fetch(`/api/admin/usuarios?key=${KEY}`);
    if (!r.ok) { document.body.innerHTML = '<p style="padding:40px;color:#ef4444">No autorizado</p>'; return; }
    const { usuarios, empresas: emps } = await r.json();
    empresas = emps;

    const select = document.getElementById('f-empresa');
    select.innerHTML = '<option value="">— Todas (Admin) —</option>';
    emps.forEach(e => select.innerHTML += `<option value="${e.id}">${e.nombre}</option>`);

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = usuarios.map(u => `
      <tr>
        <td style="color:#718096">${u.id}</td>
        <td><strong>${u.nombre}</strong></td>
        <td class="email-cell">${u.email}</td>
        <td class="pass-cell">${u.password}</td>
        <td class="empresa-cell">${u.empresa_nombre || '<span style="color:#718096">Todas las empresas</span>'}</td>
        <td><span class="badge badge-${u.rol}">${u.rol}</span></td>
        <td><span class="badge badge-${u.activo ? 'activo' : 'inactivo'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
        <td class="actions-cell">
          <button class="btn btn-edit btn-sm" onclick="editar(${JSON.stringify(u).replace(/"/g,'&quot;')})">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="eliminar(${u.id}, '${u.nombre}')">Eliminar</button>
        </td>
      </tr>
    `).join('');
  }

  function abrirModal(reset = true) {
    if (reset) {
      editando = false;
      document.getElementById('modal-title').textContent = 'Nuevo Usuario';
      document.getElementById('edit-id').value = '';
      document.getElementById('f-nombre').value = '';
      document.getElementById('f-email').value = '';
      document.getElementById('f-password').value = '';
      document.getElementById('f-empresa').value = '';
      document.getElementById('f-rol').value = 'usuario';
      document.getElementById('activo-row').style.display = 'none';
    }
    document.getElementById('modal').classList.add('open');
  }

  function cerrarModal() { document.getElementById('modal').classList.remove('open'); }

  function editar(u) {
    editando = true;
    document.getElementById('modal-title').textContent = 'Editar Usuario';
    document.getElementById('edit-id').value = u.id;
    document.getElementById('f-nombre').value = u.nombre;
    document.getElementById('f-email').value = u.email;
    document.getElementById('f-password').value = u.password;
    document.getElementById('f-empresa').value = u.empresa_id || '';
    document.getElementById('f-rol').value = u.rol;
    document.getElementById('f-activo').value = u.activo;
    document.getElementById('activo-row').style.display = 'block';
    abrirModal(false);
  }

  async function guardar() {
    const nombre = document.getElementById('f-nombre').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value.trim();
    const empresa_id = document.getElementById('f-empresa').value || null;
    const rol = document.getElementById('f-rol').value;
    const activo = document.getElementById('f-activo').value;
    const id = document.getElementById('edit-id').value;

    if (!nombre || !email || !password) { mostrarAlerta('Completá todos los campos obligatorios', 'error'); return; }

    const method = editando ? 'PUT' : 'POST';
    const body = editando
      ? { id, nombre, email, password, empresa_id, rol, activo: parseInt(activo) }
      : { nombre, email, password, empresa_id, rol };

    const r = await fetch(`/api/admin/usuarios?key=${KEY}`, {
      method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) { mostrarAlerta(data.error || 'Error al guardar', 'error'); return; }

    cerrarModal();
    mostrarAlerta(editando ? 'Usuario actualizado' : 'Usuario creado', 'success');
    cargar();
  }

  async function eliminar(id, nombre) {
    if (!confirm(`¿Eliminar al usuario "${nombre}"?`)) return;
    await fetch(`/api/admin/usuarios?key=${KEY}`, {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    mostrarAlerta('Usuario eliminado', 'success');
    cargar();
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById('alert');
    el.className = `alert alert-${tipo}`;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  cargar();
</script>
</body>
</html>
